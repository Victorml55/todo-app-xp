<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo App - XP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">

    <header class="app-header">
      <div class="header-left">
        <span class="header-icon">◈</span>
        <h1>Lista de Tareas</h1>
      </div>
      <button id="themeBtn" onclick="toggleTheme()">🌙</button>
    </header>

    <!-- FORMULARIO DE NUEVA TAREA -->
    <section class="add-section">
      <div class="add-form">
        <div class="add-row">
          <div class="field-group">
            <label for="taskTitle">Título</label>
            <input type="text" id="taskTitle" placeholder="Nombre de la tarea..." autocomplete="off">
          </div>
          <div class="field-group field-grow">
            <label for="taskDesc">Descripción</label>
            <input type="text" id="taskDesc" placeholder="Descripción opcional..." autocomplete="off">
          </div>
        </div>
        <div class="add-row">
          <div class="field-group field-tags">
            <label>Tags</label>
            <div class="tag-selector" id="newTaskTagSelector"></div>
          </div>
          <button id="addBtn">+ Agregar</button>
        </div>
      </div>
    </section>

    <!-- GESTIÓN DE TAGS -->
    <section class="tag-management">
      <div class="tag-mgmt-row">
        <span class="section-label">Etiquetas</span>
        <div class="new-tag-form">
          <input type="text" id="newTagInput" placeholder="Crear etiqueta..." maxlength="20" autocomplete="off">
          <button id="createTagBtn">Crear</button>
        </div>
      </div>
      <div class="tag-list-manage" id="tagListManage"></div>
    </section>

    <!-- BÚSQUEDA + FILTROS -->
    <section class="search-filter-bar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="searchInput" placeholder="Buscar tareas..." autocomplete="off">
      </div>
      <div class="filters-row">
        <div class="status-filters">
          <button class="filter-btn active" data-filter="all">Todas</button>
          <button class="filter-btn" data-filter="pending">Pendientes</button>
          <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>
        <div class="tag-filters" id="tagFilters"></div>
      </div>
    </section>

    <!-- TABLA -->
    <section class="table-section">
      <div class="table-wrap">
        <table id="taskTable">
          <thead>
            <tr>
              <th class="col-title">Título</th>
              <th class="col-desc">Descripción</th>
              <th class="col-done">Completado</th>
              <th class="col-actions">Acciones</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <span class="empty-icon">◻</span>
        <p>No hay tareas aquí.</p>
      </div>
    </section>

  </div>

  <!-- MODAL DE EDICIÓN -->
  <div class="modal-overlay" id="editModal" style="display:none;" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-header">
        <h2>Editar Tarea</h2>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label for="editTitle">Título</label>
          <input type="text" id="editTitle" placeholder="Título de la tarea...">
        </div>
        <div class="field-group">
          <label for="editDesc">Descripción</label>
          <input type="text" id="editDesc" placeholder="Descripción...">
        </div>
        <div class="field-group">
          <label>Tags</label>
          <div class="tag-selector" id="editTagSelector"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel-modal" onclick="closeEditModal()">Cancelar</button>
        <button class="btn-save-modal" onclick="saveEditModal()">Guardar cambios</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
